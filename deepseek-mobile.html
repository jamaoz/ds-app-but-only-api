        xhr.ontimeout = function () {
          reject(APIError(DS.t('networkIssue'), { status: 0, code: 'timeout' }));
        };
        var form = new FormData();
        // The API requires `purpose` to be sent before `file`.
        form.append('purpose', purpose);
        form.append('file', file, file.name || 'file');
        xhr.send(form);
      });
    },

    transcribe: async function (blob) {
      var form = new FormData();
      form.append('file', blob, 'speech.wav');
      var res;
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 90000);
      try {
        res = await fetch(apiUrl('/v1/tools/asr'), {
          method: 'POST',
          headers: authHeaders(),
          body: form,
          signal: controller.signal
        });
      } catch (err) {
        throw APIError(DS.t('asrFailed'), { status: 0, code: 'network' });
      } finally {
        clearTimeout(timer);
      }
      if (!res.ok) throw await parseErrorResponse(res);
      var data = parseDataJSON(await res.text()) || {};
      if (!data.text) throw APIError(DS.t('asrFailed'), { status: res.status });
      return data.text;
    },

    speech: async function (text, voice) {
      var res;
      try {
        res = await fetch(apiUrl('/v1/tools/tts'), {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({
            text: String(text || '').slice(0, 10000),
            voice_id: voice || 'stella',
            format: 'wav',
            filter_markdown: true
          })
        });
      } catch (err) {
        throw APIError(DS.t('networkIssue'), { status: 0, code: 'network' });
      }
      if (!res.ok) throw await parseErrorResponse(res);
      return res.blob();
    }
  };

  DS.friendlyError = function (err) {
    if (!err) return DS.t('serverError');
    if (err.name === 'AbortError') return DS.t('aborted');
    switch (err.status) {
      case 401:
        return DS.t('keyInvalid');
      case 402:
        return DS.t('insufficientBalance');
      case 403:
        return DS.t('serverError');
      case 404:
        return err.message || DS.t('serverError');
      case 413:
        return DS.t('fileTooLarge');
      case 422:
        return err.message || DS.t('serverError');
      case 429:
        return DS.t('rateLimited');
      default:
        break;
    }
    if (err.status >= 500) return DS.t('serverError');
    if (err.code === 'network') return DS.t('networkIssue');
    return err.message || DS.t('serverError');
  };

  /* ================================================================== */
  /* UI kit                                                             */
  /* ================================================================== */

  function $(id) {
    return document.getElementById(id);
  }

  var overlayStack = [];

  function scrimEl() { return $('scrim'); }

  function showScrim() {
    var scrim = scrimEl();
    if (!scrim) return;
    scrim.hidden = false;
    requestAnimationFrame(function () { scrim.classList.add('show'); });
  }

  function hideScrim() {
    var scrim = scrimEl();
    if (!scrim) return;
    scrim.classList.remove('show');
    setTimeout(function () {
      if (!overlayStack.length) scrim.hidden = true;
    }, 280);
  }

  function pushOverlay(el, options) {
    options = options || {};
    overlayStack.push({ el: el, onClose: options.onClose });
    showScrim();
    requestAnimationFrame(function () { el.classList.add('open'); });
    el.setAttribute('aria-hidden', 'false');
  }

  function popOverlay(el) {
    var index = -1;
    for (var i = overlayStack.length - 1; i >= 0; i--) {
      if (!el || overlayStack[i].el === el) { index = i; break; }
    }
    if (index === -1) return;
    var entry = overlayStack.splice(index, 1)[0];
    entry.el.classList.remove('open');
    entry.el.setAttribute('aria-hidden', 'true');
    if (entry.onClose) {
      setTimeout(function () { entry.onClose(entry.el); }, 340);
    }
    if (!overlayStack.length) hideScrim();
  }

  function closeTopOverlay() {
    var top = overlayStack[overlayStack.length - 1];
    if (!top) return false;
    popOverlay(top.el);
    return true;
  }

  function openDrawer() {
    var drawer = $('drawer');
    if (!drawer || drawer.classList.contains('open')) return;
    var pop = $('morePopover');
    if (pop) pop.hidden = true;
    DS.History.render();
    pushOverlay(drawer);
  }

  function closeDrawer() {
    popOverlay($('drawer'));
  }

  function openSettings() {
    if (!$('drawer').classList.contains('open')) {
      /* keep stack tidy */
    } else {
      closeDrawer();
    }
    DS.Settings.open();
  }

  function openSheetElement(sheet) {
    pushOverlay(sheet);
  }

  function createSheet(options) {
    var sheet = document.createElement('section');
    sheet.className = 'sheet dynamic-sheet';
    sheet.setAttribute('aria-hidden', 'true');
    sheet.innerHTML =
      '<div class="sheet-grab" aria-hidden="true"></div>' +
      '<header class="sheet-head"><h2></h2>' +
      '<button type="button" class="icon-btn sheet-close" aria-label="' + C.escapeAttr(DS.t('close')) + '">' +
      I.svg('close', 22) + '</button></header>' +
      '<div class="sheet-body"></div>';
    sheet.querySelector('h2').textContent = options.title || '';
    var body = sheet.querySelector('.sheet-body');
    if (typeof options.body === 'string') body.innerHTML = options.body;
    else if (options.body) body.appendChild(options.body);
    $('app').appendChild(sheet);
    var close = function () {
      popOverlay(sheet);
      setTimeout(function () {
        if (sheet.parentNode) sheet.parentNode.removeChild(sheet);
      }, 380);
    };
    sheet.querySelector('.sheet-close').addEventListener('click', close);
    if (options.onMount) options.onMount(body, sheet, close);
    openSheetElement(sheet);
    return { el: sheet, body: body, close: close };
  }

  function toast(message, options) {
    options = options || {};
    var host = $('toastHost');
    if (!host) return;
    var el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.innerHTML = (options.icon ? I.svg(options.icon, 16) : '') + '<span></span>';
    el.querySelector('span').textContent = message;
    host.appendChild(el);
    setTimeout(function () {
      el.classList.add('out');
      setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 220);
    }, options.duration || 2200);
    while (host.children.length > 3) host.removeChild(host.firstChild);
  }

  function haptic() {
    if (DS.settings.haptics && navigator.vibrate) {
      try { navigator.vibrate(8); } catch (e) {}
    }
  }

  function dialog(options) {
    return new Promise(function (resolve) {
      var layer = $('dialogHost');
      layer.hidden = false;
      var card = document.createElement('div');
      card.className = 'dialog-card';
      card.setAttribute('role', 'dialog');
      card.setAttribute('aria-modal', 'true');
      var title = options.title ? '<h3 class="dialog-title">' + C.escapeHtml(options.title) + '</h3>' : '';
      var text = options.text ? '<p class="dialog-text">' + C.escapeHtml(options.text) + '</p>' : '';
      var input = options.input
        ? '<input class="dialog-input" type="text" value="' + C.escapeAttr(options.value || '') +
          '" placeholder="' + C.escapeAttr(options.placeholder || '') + '">'
        : '';
      card.innerHTML = title + text + input +
        '<div class="dialog-actions">' +
        (options.hideCancel ? '' : '<button type="button" data-act="cancel">' + C.escapeHtml(options.cancelText || DS.t('cancel')) + '</button>') +
        '<button type="button" class="' + (options.danger ? 'danger' : 'primary') + '" data-act="ok">' +
        C.escapeHtml(options.confirmText || DS.t('confirm')) + '</button></div>';
      layer.innerHTML = '';
      layer.appendChild(card);
      var inputEl = card.querySelector('.dialog-input');
      var done = function (value) {
        layer.hidden = true;
        layer.innerHTML = '';
        resolve(value);
      };
      var ok = function () {
        if (options.input) {
          var value = inputEl.value.trim();
          if (options.required !== false && !value) {
            inputEl.focus();
            return;
          }
          done(value);
        } else {
          done(true);
        }
      };
      card.querySelector('[data-act="ok"]').addEventListener('click', ok);
      var cancelBtn = card.querySelector('[data-act="cancel"]');
      if (cancelBtn) cancelBtn.addEventListener('click', function () { done(options.input ? null : false); });
      layer.onclick = function (e) {
        if (e.target === layer) done(options.input ? null : false);
      };
      var keyHandler = function (e) {
        if (e.key === 'Escape') {
          document.removeEventListener('keydown', keyHandler, true);
          done(options.input ? null : false);
        } else if (e.key === 'Enter' && (!inputEl || e.target === inputEl)) {
          e.preventDefault();
          document.removeEventListener('keydown', keyHandler, true);
          ok();
        }
      };
      document.addEventListener('keydown', keyHandler, true);
      setTimeout(function () {
        if (inputEl) {
          inputEl.focus();
          inputEl.select();
        } else {
          var btn = card.querySelector('[data-act="ok"]');
          if (btn) btn.focus();
        }
      }, 60);
    });
  }

  DS.ui = {
    $: $,
    icon: function (name, size, cls) { return I.svg(name, size || 20, cls || ''); },
    hydrateIcons: function (root) {
      (root || document).querySelectorAll('[data-icon]').forEach(function (el) {
        el.innerHTML = I.svg(el.dataset.icon, Number(el.dataset.size) || 20);
      });
    },
    toast: toast,
    haptic: haptic,
    dialog: dialog,
    confirm: function (options) {
      return dialog({
        title: options.title || DS.t('confirm'),
        text: options.text,
        confirmText: options.confirmText || DS.t('confirm'),
        cancelText: options.cancelText || DS.t('cancel'),
        danger: options.danger
      });
    },
    prompt: function (options) {
      return dialog({
        title: options.title,
        text: options.text,
        input: true,
        value: options.value || '',
        placeholder: options.placeholder || '',
        confirmText: options.confirmText || DS.t('save'),
        cancelText: options.cancelText || DS.t('cancel')
      });
    },
    sheet: createSheet,
    pushOverlay: pushOverlay,
    popOverlay: popOverlay,
    openDrawer: openDrawer,
    closeDrawer: closeDrawer,
    closeTopOverlay: closeTopOverlay,
    closeAllOverlays: function () {
      while (overlayStack.length) {
        var top = overlayStack[overlayStack.length - 1];
        popOverlay(top.el);
      }
    },
    toastHost: function () { return $('toastHost'); }
  };

  /* ================================================================== */
  /* Theme, language, viewport                                          */
  /* ================================================================== */

  function applyTheme() {
    var pref = DS.settings.theme;
    var dark = pref === 'dark';
    if (pref === 'auto') {
      dark = !!(global.matchMedia && global.matchMedia('(prefers-color-scheme: dark)').matches);
    }
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    var meta = document.querySelector('meta[name="theme-color"]:not([media])');
    if (!meta) {
      meta = document.createElement('meta');
      meta.name = 'theme-color';
      document.head.appendChild(meta);
    }
    meta.setAttribute('content', dark ? '#0f1115' : '#f6f8fc');
  }

  function applyFontSize() {
    document.documentElement.style.setProperty('--msg-font', DS.settings.fontSize + 'px');
  }

  function applyI18n(root) {
    var scope = root || document;
    scope.querySelectorAll('[data-i18n]').forEach(function (el) {
      el.textContent = DS.t(el.dataset.i18n);
    });
    scope.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
      el.setAttribute('placeholder', DS.t(el.dataset.i18nPh));
    });
    scope.querySelectorAll('[data-i18n-aria]').forEach(function (el) {
      el.setAttribute('aria-label', DS.t(el.dataset.i18nAria));
    });
    document.documentElement.lang = DS.settings.lang === 'en' ? 'en' : 'zh-CN';
  }

  DS.applyI18n = applyI18n;
  DS.applyTheme = applyTheme;
  DS.applyFontSize = applyFontSize;

  DS.setLanguage = function (lang) {
    DS.settings.lang = lang;
    DS.saveSettings();
    applyI18n();
    if (DS.state.current) DS.Chat.renderAll();
    DS.History.render();
    if (DS.state.ready) DS.Chat.updateWelcome();
  };

  function setupViewport() {
    function apply() {
      var height = global.visualViewport ? global.visualViewport.height : global.innerHeight;
      document.documentElement.style.setProperty('--app-height', height + 'px');
    }
    apply();
    if (global.visualViewport) {
      global.visualViewport.addEventListener('resize', function () {
        apply();
        if (DS.state.streaming) DS.Chat.scrollToBottom(true);
      });
      global.visualViewport.addEventListener('scroll', apply);
    }
    global.addEventListener('orientationchange', function () {
      setTimeout(apply, 220);
    });
    global.addEventListener('resize', apply);
  }

  function setupNetwork() {
    var bar = $('offlineBar');
    function update() {
      var offline = !navigator.onLine;
      if (bar) bar.hidden = !offline;
      if (!offline && DS.state.ready) toast(DS.t('online'), { icon: 'check', duration: 1400 });
    }
    global.addEventListener('online', update);
    global.addEventListener('offline', update);
    if (!navigator.onLine) bar.hidden = false;
  }

  function setupPWA() {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      global.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
    global.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      DS.state.deferredPrompt = e;
      if (DS.state.view === 'main' && !global.localStorage.getItem(INSTALL_DISMISSED_KEY)) {
        var banner = $('installBanner');
        if (banner) banner.hidden = false;
      }
    });
    global.addEventListener('appinstalled', function () {
      DS.state.deferredPrompt = null;
      var banner = $('installBanner');
      if (banner) banner.hidden = true;
      toast(DS.t('installed'), { icon: 'check' });
    });
    document.addEventListener('click', function (e) {
      var target = e.target.closest ? e.target.closest('[data-install]') : null;
      if (!target) return;
      installApp();
    });
  }

  async function installApp() {
    var prompt = DS.state.deferredPrompt;
    if (prompt) {
      prompt.prompt();
      try {
        var choice = await prompt.userChoice;
        if (choice && choice.outcome === 'accepted') {
          toast(DS.t('installed'), { icon: 'check' });
        }
      } catch (e) {}
      DS.state.deferredPrompt = null;
      var banner = $('installBanner');
      if (banner) banner.hidden = true;
      return;
    }
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (ios) {
      await dialog({
        title: DS.t('installIos'),
        text: DS.t('installIosBody'),
        confirmText: DS.t('done'),
        hideCancel: true
      });
      return;
    }
    toast(DS.t('installHint'), { icon: 'install', duration: 3200 });
  }

  DS.installApp = installApp;

  /* ================================================================== */
  /* Sessions                                                           */
  /* ================================================================== */

  function newSessionObject() {
    var now = Date.now();
    var model = DS.getModel(DS.settings.model).id;
    var webSearch = !!DS.settings.webSearch;
    if (webSearch) model = 'deepseek-flash';
    return {
      id: C.uid('s_'),
      title: '',
      createdAt: now,
      updatedAt: now,
      pinned: false,
      model: model,
      thinking: !!DS.settings.thinking,
      effort: DS.settings.effort,
      webSearch: webSearch,
      messages: []
    };
  }

  DS.createSession = function (options) {
    options = options || {};
    var session = newSessionObject();
    DS.state.current = session;
    DS.state.sessions.unshift(session);
    if (options.save !== false) DS.saveSession(session);
    try {
      global.localStorage.setItem(LAST_SESSION_KEY, session.id);
    } catch (e) {}
    DS.Chat.resetView();
    DS.History.render();
    DS.Chat.updateTopbar();
    return session;
  };

  function normalizeSession(session) {
    if (!session) return session;
    if (!Array.isArray(session.messages)) session.messages = [];
    session.messages.forEach(function (message) {
      if (message && message.status === 'streaming') {
        message.status = 'aborted';
        message.error = '';
      }
    });
    return session;
  }

  DS.openSession = function (sessionOrId) {
    var session = typeof sessionOrId === 'string'
      ? DS.state.sessions.filter(function (s) { return s.id === sessionOrId; })[0]
      : sessionOrId;
    if (!session) return;
    normalizeSession(session);
    if (DS.state.streaming && DS.state.streaming.sessionId !== session.id) {
      DS.Chat.stop();
    }
    DS.state.current = session;
    try {
      global.localStorage.setItem(LAST_SESSION_KEY, session.id);
    } catch (e) {}
    DS.Chat.renderAll();
    DS.Chat.updateTopbar();
    DS.History.render();
  };

  DS.newChat = function () {
    var current = DS.state.current;
    if (current && !current.messages.length) {
      DS.ui.closeDrawer();
      DS.Chat.focusInput();
      return;
    }
    if (DS.state.streaming) DS.Chat.stop();
    DS.createSession();
    DS.ui.closeDrawer();
    DS.Chat.focusInput();
  };

  DS.saveSession = function (session, options) {
    session = session || DS.state.current;
    if (!session) return Promise.resolve();
    if (!DS.state.sessions.some(function (s) { return s.id === session.id; })) {
      return Promise.resolve();
    }
    session.updatedAt = Date.now();
    var copy = JSON.parse(JSON.stringify(session));
    DS.state.sessions = DS.state.sessions
      .filter(function (s) { return s.id !== session.id; })
      .concat([session])
      .sort(function (a, b) {
        if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
        return (b.updatedAt || 0) - (a.updatedAt || 0);
      });
    DS.History.render();
    return Store.put(copy);
  };

  DS.deleteSession = async function (id) {
    if (DS.state.streaming && DS.state.streaming.sessionId === id) DS.Chat.stop();
    await Store.remove(id);
    DS.state.sessions = DS.state.sessions.filter(function (s) { return s.id !== id; });
    if (DS.state.current && DS.state.current.id === id) {
      var next = DS.state.sessions[0];
      if (next) DS.openSession(next);
      else DS.createSession({ save: false });
    }
    DS.History.render();
  };

  DS.clearAllSessions = async function () {
    if (DS.state.streaming) DS.Chat.stop();
    await Store.clear();
    DS.state.sessions = [];
    DS.createSession({ save: false });
  };

  DS.sessionTitle = function (session) {
    if (!session) return DS.t('newChat');
    if (session.title) return session.title;
    var firstUser = (session.messages || []).filter(function (m) { return m.role === 'user'; })[0];
    if (firstUser) return C.titleFromText(firstUser.content, 24) || DS.t('newChat');
    return DS.t('newChat');
  };

  function showOnboarding() {
    DS.state.view = 'onboarding';
    $('onboarding').hidden = false;
    $('appMain').hidden = true;
    var keyInput = $('apiKeyInput');
    if (DS.settings.apiKey) keyInput.value = DS.settings.apiKey;
    $('baseUrlInput').value = DS.settings.baseUrl || DEFAULT_SETTINGS.baseUrl;
    if (DS.settings.apiKey) {
      var box = $('advancedBox');
      if (box) box.open = false;
    }
    setTimeout(function () {
      var coarse = global.matchMedia && global.matchMedia('(pointer: coarse)').matches;
      if (!coarse) keyInput.focus();
    }, 200);
  }

  function showMain() {
    DS.state.view = 'main';
    $('onboarding').hidden = true;
    $('appMain').hidden = false;
    DS.Chat.updateWelcome();
    DS.Chat.updateTopbar();
  }

  DS.showOnboarding = showOnboarding;
  DS.showMain = showMain;

  async function handleStart(event) {
    event.preventDefault();
    var keyInput = $('apiKeyInput');
    var baseInput = $('baseUrlInput');
    var errorEl = $('keyError');
    var btn = $('startBtn');
    var spinner = $('startSpinner');
    var label = btn.querySelector('.btn-label');
    var key = keyInput.value.trim();
    var base = C.normalizeBaseUrl(baseInput.value);
    errorEl.hidden = true;
    if (!key) {
      errorEl.textContent = DS.t('keyRequired');
      errorEl.hidden = false;
      keyInput.focus();
      return;
    }
    btn.disabled = true;
    spinner.hidden = false;
    label.textContent = DS.t('verifying');
    try {
      var result = await DS.API.testConnection(base, key);
      DS.settings.apiKey = key;
      DS.settings.baseUrl = base;
      DS.settings.onboarded = true;
      DS.saveSettings();
      if (result.models && result.models.length) {
        DS.state.models = result.models;
        result.models.forEach(function (m) { DS.state.modelMap[m.id] = m; });
        if (!DS.state.modelMap[DS.settings.model] && result.models[0]) {
          DS.settings.model = result.models[0].id;
          DS.saveSettings();
        }
      }
      keyInput.blur();
      await enterApp();
    } catch (err) {
      errorEl.textContent = DS.friendlyError(err);
      errorEl.hidden = false;
      haptic();
    } finally {
      btn.disabled = false;
      spinner.hidden = true;
      label.textContent = DS.t('start');
    }
  }

  async function enterApp() {
    await Store.init();
    var sessions = await Store.all();
    DS.state.sessions = sessions.map(function (session) {
      return normalizeSession(session);
    }).sort(function (a, b) {
      if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    });
    DS.state.ready = true;
    showMain();
    var forceNew = /(?:^|[?&])new=1(?:&|$)/.test(global.location.search || '');
    if (forceNew) {
      try {
        global.history.replaceState(null, '', global.location.pathname + global.location.hash);
      } catch (e) {}
      DS.createSession({ save: false });
      DS.Chat.updateWelcome();
      DS.Chat.updateTopbar();
      DS.History.render();
      DS.History.updateStorage();
      loadModelsInBackground();
      setTimeout(function () { DS.Chat.focusInput(); }, 260);
      return;
    }
    var lastId = null;
    try { lastId = global.localStorage.getItem(LAST_SESSION_KEY); } catch (e) {}
    var session = DS.state.sessions.filter(function (s) { return s.id === lastId; })[0] || DS.state.sessions[0];
    if (session) {
      DS.openSession(session);
    } else {
      DS.createSession({ save: false });
    }
    DS.History.render();
    DS.History.updateStorage();
    DS.Chat.updateWelcome();
    DS.Chat.updateTopbar();
    loadModelsInBackground();
    setTimeout(function () { DS.Chat.focusInput(); }, 260);
  }

  async function loadModelsInBackground() {
    try {
      var models = await DS.API.listModels();
      if (models && models.length) {
        models.forEach(function (m) { DS.state.modelMap[m.id] = m; });
      }
    } catch (e) {
      /* offline or invalid — defaults are enough */
    }
  }

  function autoSizeInput() {
    var input = $('input');
    if (!input) return;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 132) + 'px';
  }

  DS.updateSendButton = function () {
    var input = $('input');
    var btn = $('btnSend');
    if (!input || !btn) return;

      if (document.visibilityState === 'hidden' && DS.state.streaming) {
        persist(DS.state.current);
      }
    });
  };

  function autoSize() {
    if (!inputEl) return;
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 132) + 'px';
  }

  Chat.focusInput = function () {
    if (!inputEl) return;
    var coarse = global.matchMedia && global.matchMedia('(pointer: coarse)').matches;
    if (!coarse) inputEl.focus({ preventScroll: true });
    requestAnimationFrame(function () { Chat.scrollToBottom(true); });
  };

  /* ------------------------------------------------------------------ */
  /* Welcome & topbar                                                    */
  /* ------------------------------------------------------------------ */

  Chat.updateWelcome = function () {
    if (!welcomeEl) return;
    var session = DS.state.current;
    var empty = !session || !session.messages.length;
    welcomeEl.hidden = !empty;
    if (!empty) return;
    var hour = new Date().getHours();
    var zh;
    if (hour < 5) zh = '夜深了';
    else if (hour < 9) zh = '早上好';
    else if (hour < 11) zh = '上午好';
    else if (hour < 14) zh = '中午好';
    else if (hour < 18) zh = '下午好';
    else zh = '晚上好';
    var title = DS.isZh() ? zh + '，今天想做点什么？' : 'Good day. What shall we do?';
    if (DS.isZh() && hour >= 18) title = '晚上好，今天想做点什么？';
    var titleEl = document.getElementById('welcomeTitle');
    if (titleEl) titleEl.textContent = title;
    var prompts = SUGGESTIONS[DS.isZh() ? 'zh' : 'en'];
    document.querySelectorAll('#suggestions .suggestion').forEach(function (btn, index) {
      if (prompts[index]) btn.dataset.prompt = prompts[index];
    });
  };

  Chat.updateTopbar = function () {
    var session = DS.state.current;
    var title = DS.sessionTitle(session);
    var el = document.getElementById('topbarTitle');
    if (el) el.textContent = title;
    var modelEl = document.getElementById('topbarModel');
    if (modelEl) modelEl.textContent = session ? session.model : DS.settings.model;
    document.title = title && title !== t('newChat') ? title + ' · DeepSeek' : 'DeepSeek';
    updateChips();
  };

  function updateChips() {
    var session = DS.state.current;
    if (!session) return;
    var thinkChip = document.getElementById('chipThink');
    var searchChip = document.getElementById('chipSearch');
    thinkChip.setAttribute('aria-pressed', session.thinking ? 'true' : 'false');
    searchChip.setAttribute('aria-pressed', session.webSearch ? 'true' : 'false');
    var modelEl = document.getElementById('topbarModel');
    if (modelEl) modelEl.textContent = session.model || DS.settings.model;
    DS.updateSendButton();
  }

  Chat.toggleThinking = function () {
    var session = DS.state.current;
    if (!session) return;
    session.thinking = !session.thinking;
    DS.settings.thinking = session.thinking;
    DS.saveSettings();
    DS.saveSession(session);
    updateChips();
    DS.ui.haptic();
  };

  Chat.toggleSearch = function () {
    var session = DS.state.current;
    if (!session) return;
    var next = !session.webSearch;
    session.webSearch = next;
    DS.settings.webSearch = next;
    if (next && session.model !== 'deepseek-flash') {
      session.model = 'deepseek-flash';
      DS.settings.model = 'deepseek-flash';
      DS.saveSettings();
      DS.ui.toast(t('searchOnlyFlash'), { icon: 'alert' });
    }
    DS.saveSettings();
    DS.saveSession(session);
    updateChips();
    DS.ui.haptic();
  };

  Chat.openModelPicker = function () {
    var session = DS.state.current;
    if (!session) return;
    var models = DS.state.models && DS.state.models.length ? DS.state.models : DS.DEFAULT_MODELS;
    var body = document.createElement('div');
    var list = document.createElement('div');
    list.className = 'model-list';
    models.forEach(function (model) {
      var id = model.id;
      var info = DS.getModel(id);
      var subtitle = id + (info.desc ? ' · ' + info.desc : '');
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'model-option' + (session.model === id ? ' active' : '');
      button.innerHTML =
        '<span class="model-radio">' + (session.model === id ? I.svg('check', 14) : '') + '</span>' +
        '<span class="model-info"><b>' + escapeHtml(info.name || id) + '</b>' +
        '<small>' + escapeHtml(subtitle) + '</small></span>' +
        (info.vision ? '<span class="model-tag">' + (DS.isZh() ? '支持图片' : 'Vision') + '</span>' : '');
      button.addEventListener('click', function () {

      : 'deepseek-flash is fast and supports images and web tools; deepseek-v4-pro is stronger at text reasoning but does not accept images.';
    body.appendChild(note);

    var sheet = DS.ui.sheet({ title: DS.isZh() ? '选择模型' : 'Choose a model', body: body });
