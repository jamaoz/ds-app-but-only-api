  /* ------------------------------------------------------------------ */
  /* Rendering                                                           */
  /* ------------------------------------------------------------------ */

  Chat.renderAll = function () {
    if (!messagesEl) return;
    var session = DS.state.current;
    if (!session) return;
    if (lastRenderedSession !== session.id) {
      DS.state.attachments = [];
      Chat.renderAttachments();
      lastRenderedSession = session.id;
    }
    messagesEl.innerHTML = '';
    session.messages.forEach(function (msg) {
      messagesEl.appendChild(buildMessage(msg));
    });
    Chat.updateWelcome();
    updateChips();
    requestAnimationFrame(function () { Chat.scrollToBottom(true); });
  };

  Chat.resetView = function () {
    lastRenderedSession = null;
    Chat.renderAll();
    Chat.updateWelcome();
    Chat.updateTopbar();
  };

  function buildMessage(msg) {
    var article = document.createElement('article');
    article.className = 'msg ' + (msg.role === 'user' ? 'msg-user' : 'msg-ai');
    article.dataset.id = msg.id;
    if (msg.role === 'user') {
      article.innerHTML = renderUser(msg);
    } else {
      article.innerHTML =
        '<div class="ai-avatar">' + I.svg('logo', 28) + '</div>' +
        '<div class="ai-main">' + renderAssistantInner(msg, msg.status === 'streaming') + '</div>';
    }
    return article;
  }

  function renderUser(msg) {
    var html = '<div class="user-bubble">';
    var attachments = msg.attachments || [];
    if (attachments.length) {
      html += '<div class="user-attachments">';
      attachments.forEach(function (att) {
        if (att.kind === 'image' && att.dataUrl) {
          html += '<img class="user-image" src="' + C.escapeAttr(att.dataUrl) + '" alt="' +
            C.escapeAttr(att.name || 'image') + '" loading="lazy">';
        } else {
          html += '<span class="user-file">' + I.svg('file', 15) + '<span>' +
            escapeHtml(att.name || 'file') + '</span></span>';
        }
      });
      html += '</div>';
    }
    if (msg.content) {
      html += '<div class="msg-text">' + escapeHtml(msg.content) + '</div>';
    }
    html += '</div>';
    return html;
  }

  function collectSearchData(msg) {
    var queries = [];
    var sources = [];
    var seenUrls = {};

    function addSource(url, title, host) {
      if (!url || !/^https?:\/\//i.test(url) || seenUrls[url]) return;
      seenUrls[url] = true;
      sources.push({
        url: url,
        title: title || C.hostOf(url),
        host: host || C.hostOf(url)
      });
    }

    (msg.annotations || []).forEach(function (ann) {
      var cite = ann && ann.url_citation ? ann.url_citation : ann;
      if (cite && cite.url) addSource(cite.url, cite.title);
    });

    (msg.serverToolCalls || []).forEach(function (step) {
      (step.calls || []).forEach(function (call) {
        var action = call.action || {};
        (action.queries || []).forEach(function (q) {
          if (q && queries.indexOf(q) === -1) queries.push(q);
        });
        (call.sources || []).forEach(function (source) {
          addSource(source.url, source.title, source.site_name);
        });
        if (call.page && call.page.url) addSource(call.page.url, call.page.title);
      });
    });

    return { queries: queries, sources: sources };
  }

  function renderSearchCard(msg, streaming) {
    var data = collectSearchData(msg);
    var searching = !!msg.searching;
    if (!data.queries.length && !data.sources.length && !searching) return '';
    var count = data.sources.length;
    var label;
    if (streaming && searching && !data.sources.length) {
      label = t('searching');
    } else if (streaming && searching) {
      label = t('searching') + ' · ' + count + ' ' + t('searchSources');
    } else {
      label = t('searched') + ' ' + count + ' ' + t('searchSources');
    }
    var html = '<div class="search-card' + (data.sources.length ? '' : ' no-sources') + '">';
    html += '<button type="button" class="search-head">' + I.svg('globe', 15) +
      '<span>' + escapeHtml(label) + '</span>' +
      (data.sources.length ? '<span class="think-chevron">' + I.svg('chevronDown', 15) + '</span>' : '') +
      '</button>';
    if (data.queries.length) {
      html += '<div class="search-queries">';
      data.queries.forEach(function (query) {
        html += '<span class="search-query">' + escapeHtml(query) + '</span>';
      });
      html += '</div>';
    }
    if (data.sources.length) {
      html += '<div class="search-sources"><div class="search-sources-inner">';
      data.sources.forEach(function (source) {
        html += '<a class="search-source" href="' + C.escapeAttr(source.url) +
          '" target="_blank" rel="noopener noreferrer">' +
          '<span class="source-badge">' + escapeHtml((source.host || '?').charAt(0).toUpperCase()) + '</span>' +
          '<span class="source-body"><span class="source-title">' + escapeHtml(source.title) + '</span>' +
          '<span class="source-domain">' + escapeHtml(source.host) + '</span></span></a>';
      });
      html += '</div></div>';
    }
    html += '</div>';
    return html;
  }

  function renderThinking(msg, streaming) {
    if (!msg.reasoning && !(streaming && msg.thinkingStartedAt)) return '';
    var ms = msg.reasoningMs || (msg.thinkingStartedAt ? Date.now() - msg.thinkingStartedAt : 0);
    var shown = Math.max(ms, 1000);
    var label = streaming
      ? t('thinkingDoing') + (shown > 1500 ? ' ' + C.formatDuration(shown) : '')
      : t('thinkingDone') + '（' + C.formatDuration(shown) + '）';
    if (!DS.isZh() && !streaming) label = t('thinkingDone') + ' ' + C.formatDuration(shown);
    var open = streaming ? msg.thinkingOpen !== false : !!msg.thinkingOpen;
    return '<div class="thinking' + (open ? ' open' : '') + (streaming ? ' is-live' : '') + '">' +
      '<button type="button" class="thinking-head">' + I.svg('bulb', 15) +
      '<span>' + escapeHtml(label) + '</span>' +
      '<span class="think-chevron">' + I.svg('chevronDown', 15) + '</span></button>' +
      '<div class="thinking-body"><div><div class="thinking-text md">' +
      (msg.reasoning ? C.renderMarkdown(msg.reasoning) : '<span class="typing"><i></i><i></i><i></i></span>') +
      '</div></div></div></div>';
  }

  function renderReferences(msg) {
    var citations = (msg.annotations || []).map(function (ann) {
      return ann && ann.url_citation ? ann.url_citation : ann;
    }).filter(function (cite) {
      return cite && cite.url && /^https?:\/\//i.test(cite.url);
    });
    citations = C.uniqueBy(citations, function (cite) { return cite.url; });
    if (!citations.length) return '';
    var html = '<div class="references"><div class="references-title">' + I.svg('globe', 13) +
      '<span>' + escapeHtml(t('references')) + '</span></div><div class="ref-list">';
    citations.forEach(function (cite, index) {
      html += '<div class="ref-item"><span class="ref-index">' + (index + 1) + '</span>' +
        '<a href="' + C.escapeAttr(cite.url) + '" target="_blank" rel="noopener noreferrer">' +
        escapeHtml(cite.title || C.hostOf(cite.url)) + '</a></div>';
    });
    html += '</div></div>';
    return html;
  }

  function renderUsage(msg) {
    if (!DS.settings.showUsage || !msg.usage) return '';
    var total = msg.usage.total_tokens;
    if (!total) total = (msg.usage.prompt_tokens || 0) + (msg.usage.completion_tokens || 0);
    if (!total) return '';
    var extra = '';
    if (msg.usage.completion_tokens_details && msg.usage.completion_tokens_details.reasoning_tokens) {
      extra = ' · ' + C.formatNumber(msg.usage.completion_tokens_details.reasoning_tokens) +
        (DS.isZh() ? ' 推理' : ' reasoning');
    }
    return '<div class="msg-meta"><span>' + C.formatNumber(total) + ' ' + t('tokens') + extra + '</span></div>';
  }

  function renderActions(msg, hasContent) {
    var html = '<div class="msg-actions">';
    if (hasContent !== false) {
      html += '<button type="button" class="icon-btn" data-act="copy" aria-label="' + escapeHtml(t('copy')) + '" title="' +
        escapeHtml(t('copy')) + '">' + I.svg('copy', 16) + '</button>';
      html += '<button type="button" class="icon-btn" data-act="speak" aria-label="' + escapeHtml(t('readAloud')) + '" title="' +
        escapeHtml(t('readAloud')) + '">' + I.svg('volume', 16) + '</button>';
    }
    html += '<button type="button" class="action-text" data-act="regen">' + I.svg('refresh', 14) +
      '<span>' + escapeHtml(t('regenerate')) + '</span></button>';
    html += '</div>';
    return html;
  }

  function addCaret(html) {
    if (/<\/(p|li|h[1-6]|td|th|blockquote)>\s*$/.test(html)) {
      return html.replace(/<\/(p|li|h[1-6]|td|th|blockquote)>\s*$/, '<span class="caret"></span></$1>');
    }
    return html + '<span class="caret"></span>';
  }

  function renderAssistantInner(msg, streaming) {
    var html = '<div class="ai-name"><span>DeepSeek</span><span class="ai-model">' +
      escapeHtml(msg.model || 'deepseek-flash') + '</span></div>';
    html += renderThinking(msg, streaming);
    html += renderSearchCard(msg, streaming);

    var hasBody = !!msg.content;
    if (hasBody || streaming) {
      html += '<div class="answer md' + (hasBody ? '' : ' is-empty') + '">';
      if (hasBody) {
        var rendered = C.renderMarkdown(msg.content);
        if (streaming) rendered = addCaret(rendered);
        html += rendered;
      } else {
        html += '<span class="typing"><i></i><i></i><i></i></span>';
      }
      html += '</div>';
    }

    html += renderReferences(msg);
    html += renderUsage(msg);

    if (msg.error) {
      html += '<div class="msg-error">' + escapeHtml(msg.error) +
        (msg.role === 'assistant' && !streaming ? ' · <button type="button" class="retry-link" data-act="retry">' +
          escapeHtml(t('retry')) + '</button>' : '') + '</div>';
    }
    if (msg.status === 'aborted') {
      html += '<div class="msg-meta"><span>' + escapeHtml(t('aborted')) + '</span></div>';
    }
    if (!streaming && (msg.content || msg.status === 'aborted')) {
      html += renderActions(msg, !!msg.content);
    }
    return html;
  }

  function refreshAssistant(msg) {
    var article = messagesEl.querySelector('.msg[data-id="' + msg.id + '"]');
    if (!article) return;
    var container = article.querySelector('.ai-main');
    if (!container) return;
    var openSearch = container.querySelector('.search-card');
    var searchOpen = openSearch ? openSearch.classList.contains('open') : false;

    container.innerHTML = renderAssistantInner(msg, msg.status === 'streaming');

    if (searchOpen) {
      var card = container.querySelector('.search-card');
      if (card) card.classList.add('open');
    }
    if (autoScroll) Chat.scrollToBottom(true);
  }

  var refreshScheduled = false;
  function scheduleRefresh(msg) {
    if (refreshScheduled) return;
    refreshScheduled = true;
    setTimeout(function () {
      refreshScheduled = false;
      refreshAssistant(msg);
    }, 90);
  }

  function appendMessage(msg) {
    messagesEl.appendChild(buildMessage(msg));
    Chat.updateWelcome();
    if (autoScroll) Chat.scrollToBottom(true);
  }

  /* ------------------------------------------------------------------ */
  /* Scrolling                                                           */
  /* ------------------------------------------------------------------ */

  Chat.scrollToBottom = function (smooth) {
    if (!scrollerEl) return;
    var top = scrollerEl.scrollHeight;
    if (smooth && scrollerEl.scrollTop < top - 400) {
      scrollerEl.scrollTo({ top: top, behavior: 'smooth' });
    } else {
      scrollerEl.scrollTop = top;
    }
    autoScroll = true;
    var btn = document.getElementById('scrollBottom');
    if (btn) btn.hidden = true;
  };

  Chat.handleScroll = function () {
    if (!scrollerEl) return;
    var distance = scrollerEl.scrollHeight - scrollerEl.scrollTop - scrollerEl.clientHeight;
    autoScroll = distance < 140;
    var btn = document.getElementById('scrollBottom');
    if (btn) {
      btn.hidden = distance < 260;
      updateFabPosition();
    }
    var topbar = document.getElementById('topbar');
    if (topbar) topbar.classList.toggle('scrolled', scrollerEl.scrollTop > 4);
  };

  function updateFabPosition() {
    var btn = document.getElementById('scrollBottom');
    var wrap = document.getElementById('composerWrap');
    if (!btn || !wrap) return;
    btn.style.bottom = wrap.offsetHeight + 10 + 'px';
  }

  /* ------------------------------------------------------------------ */
  /* Send / stream                                                       */
  /* ------------------------------------------------------------------ */

  function firstTurn(session) {
    return session.messages.filter(function (m) { return m.role === 'user'; }).length === 1;
  }

  function buildSystemPrompt() {
    var parts = [];
    if (DS.settings.systemPrompt && DS.settings.systemPrompt.trim()) {
      parts.push(DS.settings.systemPrompt.trim());
    }
    var now = new Date();
    var dateStr;
    try {
      dateStr = now.toLocaleDateString(DS.isZh() ? 'zh-CN' : 'en-US', {
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
      });
    } catch (e) {
      dateStr = now.toISOString().slice(0, 10);
    }
    parts.push(DS.isZh() ? '当前日期：' + dateStr + '。' : 'Current date: ' + dateStr + '.');
    return parts.join('\n\n');
  }

  function buildUserContent(msg, budget) {
    var attachments = msg.attachments || [];
    var parts = [];
    attachments.forEach(function (att) {
      if (att.kind === 'image' && att.dataUrl) {
        if (budget && budget.left - att.dataUrl.length < 0) return;
        if (budget) budget.left -= att.dataUrl.length;
        parts.push({
          type: 'image_url',
          image_url: { url: att.dataUrl, detail: 'high' }
        });
      } else if (att.kind === 'file' && att.fileId) {
        parts.push({ type: 'file', file_id: att.fileId });
      }
    });
    if (msg.content) parts.push({ type: 'text', text: msg.content });
    if (!parts.length) return '';
    if (parts.length === 1 && parts[0].type === 'text') return parts[0].text;
    return parts;
  }

  function wireServerCalls(steps) {
    return (steps || []).map(function (step) {
      return {
        index: step.index,
        reasoning_content: step.reasoning_content || '',
        calls: (step.calls || []).map(function (call) {
          var out = {
            index: call.index,
            id: call.id,
            type: call.type,
            kind: call.kind,
            action: call.action,
            status: call.status
          };
          if (call.page) out.page = call.page;
          if (call.signature) out.signature = call.signature;
          if (call.error) out.error = call.error;
          return out;
        })
      };
    });
  }

  function buildPayload(session, assistantId) {
    var tools = session.webSearch
      ? [{ type: 'deepseek_web_search' }, { type: 'deepseek_read_url' }]
      : null;
    var messages = [];
    var systemPrompt = buildSystemPrompt();
    if (systemPrompt) messages.push({ role: 'system', content: systemPrompt });
    var budget = { left: 24 * 1024 * 1024 };

    session.messages.forEach(function (msg) {
      if (msg.id === assistantId) return;
      if (msg.role === 'user') {
        var content = buildUserContent(msg, budget);
        if (!content) return;
        messages.push({ role: 'user', content: content });
      } else if (msg.role === 'assistant' && msg.status === 'done' && msg.content) {
        var assistant = { role: 'assistant', content: msg.content };
        if (tools) {
          assistant.reasoning_content = msg.reasoning || '';
          if (msg.serverToolCalls && msg.serverToolCalls.length) {
            assistant.server_tool_calls = wireServerCalls(msg.serverToolCalls);
          }
        }
        messages.push(assistant);
      }
    });

    var payload = {
      model: session.webSearch ? 'deepseek-flash' : (session.model || DS.settings.model),
      messages: messages,
      stream: true,
      thinking: { type: session.thinking ? 'enabled' : 'disabled' }
    };
    if (session.thinking) {
      payload.reasoning_effort = DS.settings.effort || 'high';
    }
    if (tools) payload.tools = tools;
    if (DS.settings.maxTokens > 0) payload.max_tokens = Number(DS.settings.maxTokens);
    if (!session.thinking) {
      var temp = Number(DS.settings.temperature);
      if (isFinite(temp)) payload.temperature = temp;
    }
    if (DS.settings.autoTitle && firstTurn(session)) {
      payload.title = { enabled: true };
    }
    return payload;
  }

  function setStreamingUI(active) {
    var bar = document.getElementById('streamBar');
    if (bar) bar.hidden = !active;
    DS.updateSendButton();
  }

  function startTicker() {
    stopTicker();
    tickTimer = setInterval(function () {
      if (!DS.state.streaming) return;
      var session = DS.state.current;
      if (!session) return;
      var msg = session.messages.filter(function (m) { return m.id === DS.state.streaming.messageId; })[0];
      if (msg && msg.status === 'streaming' && (msg.reasoning || msg.thinkingStartedAt)) {
        refreshAssistant(msg);
      }
    }, 700);
  }

  function stopTicker() {
    if (tickTimer) clearInterval(tickTimer);
    tickTimer = null;
  }

  function scheduleSave(session) {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      saveTimer = null;
      persist(session);
    }, 1200);
  }

  function persist(session) {
    if (!session) return;
    DS.saveSession(session).catch(function () {});
  }

  Chat.send = async function () {
    if (DS.state.streaming) return;
    var session = DS.state.current || DS.createSession({ save: false });
    if (!DS.settings.apiKey) {
      DS.ui.toast(t('noKey'), { icon: 'key' });
      DS.Settings.open();
      return;
    }
    var text = (inputEl.value || '').trim();
    if (session.webSearch && session.model !== 'deepseek-flash') {
      session.model = 'deepseek-flash';
      DS.settings.model = 'deepseek-flash';
      DS.saveSettings();
      updateChips();
      DS.ui.toast(t('searchOnlyFlash'), { icon: 'alert' });
    }
    var attachments = DS.state.attachments.slice();
    if (attachments.some(function (a) { return a.uploading; })) {
      DS.ui.toast(t('uploading') + '…', { icon: 'clock' });
      return;
    }
    attachments = attachments.filter(function (a) { return !a.error; });
    if (DS.state.attachments.some(function (a) { return a.error; })) {
      DS.ui.toast(t('attachmentError'), { icon: 'alert' });
      return;
    }
    if (!text && !attachments.length) return;

    if (attachments.some(function (a) { return a.kind === 'image'; }) && session.model !== 'deepseek-flash') {
      session.model = 'deepseek-flash';
      DS.settings.model = 'deepseek-flash';
      DS.saveSettings();
      updateChips();
      DS.ui.toast(t('imageOnlyFlash'), { icon: 'alert' });
    }
    if (attachments.length && session.model !== 'deepseek-flash') {
      session.model = 'deepseek-flash';
      DS.settings.model = 'deepseek-flash';
      DS.saveSettings();
      updateChips();
      DS.ui.toast(t('attachmentOnlyFlash'), { icon: 'alert' });
    }

    var now = Date.now();
    var userMsg = {
      id: C.uid('m_'),
      role: 'user',
      content: text,
      attachments: attachments.map(function (att) {
        return {
          id: att.id,
          kind: att.kind,
          name: att.name,
          size: att.size,
          mime: att.mime,
          dataUrl: att.dataUrl,
          fileId: att.fileId
        };
      }),
      createdAt: now
    };

    inputEl.value = '';
    autoSize();
    DS.state.attachments = [];
    Chat.renderAttachments();
    DS.updateSendButton();
    session.messages.push(userMsg);

    var assistant = {
      id: C.uid('m_'),
      role: 'assistant',
      content: '',
      reasoning: '',
      model: session.model || DS.settings.model,
      createdAt: now,
      status: 'streaming',
      usage: null,
      annotations: [],
      serverToolCalls: [],
      thinkingStartedAt: 0,
      reasoningMs: 0,
      thinkingOpen: true,
      searching: false
    };
    session.messages.push(assistant);

    appendMessage(userMsg);
    appendMessage(assistant);
    Chat.updateWelcome();
    Chat.scrollToBottom(true);
    DS.saveSession(session);
    DS.ui.haptic();

    await runReply(session, assistant);
  };

  async function runReply(session, assistant) {
    var controller = new AbortController();
    DS.state.streaming = {
      controller: controller,
      sessionId: session.id,
      messageId: assistant.id
    };
    setStreamingUI(true);
    startTicker();

    var reasoningStart = 0;
    var finishReason = '';

    function markReasoning() {
      if (!assistant.thinkingStartedAt) {
        assistant.thinkingStartedAt = Date.now();
        reasoningStart = assistant.thinkingStartedAt;
      }
      assistant.reasoningMs = Date.now() - assistant.thinkingStartedAt;
    }

    try {
      var payload = buildPayload(session, assistant.id);
      var result = await DS.API.chatStream(payload, {
        onReasoning: function (delta) {
          assistant.reasoning += delta;
          markReasoning();
          scheduleRefresh(assistant);
          scheduleSave(session);
        },
        onContent: function (delta) {
          assistant.content += delta;
          if (assistant.thinkingStartedAt && !assistant.reasoningMs) {
            assistant.reasoningMs = Date.now() - assistant.thinkingStartedAt;
          }
          scheduleRefresh(assistant);
          scheduleSave(session);
        },
        onAnnotations: function (annotations) {
          assistant.annotations = annotations || [];
          scheduleRefresh(assistant);
        },
        onServerToolCalls: function (calls) {
          assistant.serverToolCalls = calls || [];
          assistant.searching = false;
          scheduleRefresh(assistant);
        },
        onToolEvent: function (event) {
          if (event && event.type === 'call_started') assistant.searching = true;
          scheduleRefresh(assistant);
        },
        onUsage: function (usage) {
          assistant.usage = usage;
        },
        onTitle: function (title) {
          if (title && !session.title) {
            session.title = String(title).trim().slice(0, 60);
            DS.saveSession(session);
            Chat.updateTopbar();
          }
        },
        onFinishReason: function (reason) {
          finishReason = reason;
        }
      }, controller.signal);

      if (result && result.usage) assistant.usage = result.usage;
      if (result && result.title && !session.title) {
        session.title = String(result.title).trim().slice(0, 60);
      }
      if (!assistant.content && !assistant.reasoning) {
        assistant.status = 'error';
        assistant.error = DS.t('serverError');
      } else {
        assistant.status = 'done';
        if (assistant.thinkingStartedAt) {
          assistant.reasoningMs = assistant.reasoningMs || (Date.now() - assistant.thinkingStartedAt);
        }
        if (finishReason === 'length') {
          assistant.error = DS.isZh() ? '输出已达到长度上限，回答可能不完整。' : 'Output reached the length limit; the answer may be incomplete.';
        }
        if (finishReason === 'content_filter') {
          assistant.error = DS.isZh() ? '内容被安全策略拦截。' : 'The response was blocked by safety filters.';
        }
      }
    } catch (err) {
      if (err && err.name === 'AbortError') {
        assistant.status = 'aborted';
        assistant.error = '';
      } else {
        assistant.status = 'error';
        assistant.error = DS.friendlyError(err);
      }
    } finally {
      DS.state.streaming = null;
      setStreamingUI(false);
      stopTicker();
      if (assistant.thinkingStartedAt) {
        assistant.reasoningMs = assistant.reasoningMs || (Date.now() - assistant.thinkingStartedAt);
      }
      if (!assistant.thinkingTouched) assistant.thinkingOpen = false;
      if (DS.state.current && DS.state.current.id === session.id) {
        refreshAssistant(assistant);
        Chat.updateTopbar();
        Chat.handleScroll();
      }
      await DS.saveSession(session);
      DS.History.render();
      DS.History.updateStorage();
    }
  }

  Chat.stop = function () {
    if (!DS.state.streaming) return;
    try { DS.state.streaming.controller.abort(); } catch (e) {}
  };

  Chat.regenerate = async function (messageId) {
    if (DS.state.streaming) return;
    var session = DS.state.current;
    if (!session) return;
    var index = session.messages.findIndex(function (m) { return m.id === messageId; });
    if (index === -1) return;
    var msg = session.messages[index];
    if (msg.role !== 'assistant') return;
    var userIndex = index - 1;
    while (userIndex >= 0 && session.messages[userIndex].role !== 'user') userIndex--;
    if (userIndex < 0) return;
    if (index !== session.messages.length - 1) {
      var ok = await DS.ui.confirm({
        title: t('regenerate'),
        text: DS.isZh() ? '这会删除该回答之后的所有消息，确定继续吗？' : 'This removes all messages after this answer. Continue?',
        danger: true
      });
      if (!ok) return;
      session.messages = session.messages.slice(0, index);
    } else {
      session.messages = session.messages.slice(0, index);
    }
    var assistant = {
      id: C.uid('m_'),
      role: 'assistant',
      content: '',
      reasoning: '',
      model: session.model || DS.settings.model,
      createdAt: Date.now(),
      status: 'streaming',
      usage: null,
      annotations: [],
      serverToolCalls: [],
      thinkingStartedAt: 0,
      reasoningMs: 0,
      thinkingOpen: true,
      searching: false
    };
    session.messages.push(assistant);
    DS.saveSession(session);
    Chat.renderAll();
    await runReply(session, assistant);
  };

  Chat.clearCurrent = async function () {
    var session = DS.state.current;
    if (!session) return;
    var ok = await DS.ui.confirm({
      title: t('clearChat'),
      text: t('clearChatConfirm'),
      danger: true
    });
    if (!ok) return;
    if (DS.state.streaming) Chat.stop();
    session.messages = [];
    session.title = '';
    DS.saveSession(session);
    Chat.renderAll();
    Chat.updateTopbar();
    DS.History.render();
  };

  /* ------------------------------------------------------------------ */
  /* Message actions                                                     */
  /* ------------------------------------------------------------------ */

  async function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        var area = document.createElement('textarea');
        area.value = text;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
      }
      DS.ui.toast(t('copied'), { icon: 'check', duration: 1400 });
      DS.ui.haptic();
    } catch (e) {
      DS.ui.toast(t('copy') + ' ✗');
    }
  }

  function handleMessageClick(event) {
    var article = event.target.closest('.msg');
    if (!article) return;
    var session = DS.state.current;
    if (!session) return;
    var msg = session.messages.filter(function (m) { return m.id === article.dataset.id; })[0];

    var codeCopy = event.target.closest('[data-copy-code]');
    if (codeCopy) {
      var pre = codeCopy.closest('.code-block').querySelector('pre');
      if (pre) copyText(pre.innerText);
      return;
    }

    var thinkingHead = event.target.closest('.thinking-head');
    if (thinkingHead) {
      thinkingHead.parentElement.classList.toggle('open');
      if (msg) {
        msg.thinkingOpen = thinkingHead.parentElement.classList.contains('open');
        msg.thinkingTouched = true;
      }
      return;
    }

    var searchHead = event.target.closest('.search-head');
    if (searchHead) {
      searchHead.parentElement.classList.toggle('open');
      return;
    }

    var actionEl = event.target.closest('[data-act]');
    if (!actionEl || !msg) return;
    var action = actionEl.dataset.act;
    if (action === 'copy') copyText(msg.content || '');
    else if (action === 'speak') DS.Voice.speak(msg.content || '');
    else if (action === 'regen' || action === 'retry') Chat.regenerate(msg.id);
  }

  /* ------------------------------------------------------------------ */
  /* Attachments                                                         */
  /* ------------------------------------------------------------------ */

  var IMAGE_EXT = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp', 'avif', 'heic'];
  var DOC_EXT = ['pdf', 'doc', 'docx', 'ppt', 'pptx'];
  var DATA_EXT = ['txt', 'md', 'markdown', 'csv', 'tsv', 'json', 'log', 'xml', 'yaml', 'yml',
    'xls', 'xlsx', 'epub', 'html', 'css', 'js', 'ts', 'jsx', 'tsx', 'py', 'java', 'go', 'rs',
    'c', 'cpp', 'h', 'sh', 'sql', 'rb', 'php', 'swift', 'kt', 'toml', 'ini', 'conf'];
  var MAX_FILE = 100 * 1024 * 1024;

  Chat.pickFiles = function () {
    var input = document.getElementById('fileInput');
    if (input) input.click();
  };

  function extOf(name) {
    var parts = String(name || '').toLowerCase().split('.');
    return parts.length > 1 ? parts.pop() : '';
  }

  function purposeFor(file) {
    var ext = extOf(file.name);
    if (DOC_EXT.indexOf(ext) !== -1) return 'rich_layout_recognition';
    return 'user_data';
  }

  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var max = 1400;
          var width = img.naturalWidth || img.width;
          var height = img.naturalHeight || img.height;
          var scale = Math.min(1, max / Math.max(width, height));
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(width * scale));
          canvas.height = Math.max(1, Math.round(height * scale));
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          var dataUrl = canvas.toDataURL('image/jpeg', 0.82);
          URL.revokeObjectURL(url);
          resolve({ dataUrl: dataUrl, width: canvas.width, height: canvas.height });
        } catch (err) {
          URL.revokeObjectURL(url);
          reject(err);
        }
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('image decode failed'));
      };
      img.src = url;
    });
  }

  Chat.addFiles = async function (files) {
    if (!files || !files.length) return;
    for (var i = 0; i < files.length; i++) {
      var file = files[i];
      var ext = extOf(file.name);
      if (file.type && file.type.indexOf('image/') === 0 && IMAGE_EXT.indexOf(ext) !== -1) {
        if (file.size > 32 * 1024 * 1024) {
          DS.ui.toast(t('fileTooLarge'));
          continue;
        }
        if (DS.state.current && DS.state.current.model !== 'deepseek-flash') {
          DS.state.current.model = 'deepseek-flash';
          DS.settings.model = 'deepseek-flash';
          DS.saveSettings();
          updateChips();
          DS.ui.toast(t('imageOnlyFlash'), { icon: 'alert' });
        }
        try {
          var compressed = await compressImage(file);
          DS.state.attachments.push({
            id: C.uid('a_'),
            kind: 'image',
            name: file.name || 'image.jpg',
            size: compressed.dataUrl.length,
            mime: 'image/jpeg',
            dataUrl: compressed.dataUrl,
            uploading: false,
            progress: 1
          });
        } catch (e) {
          DS.ui.toast(t('uploadFailed'));
        }
        continue;
      }
      if (DOC_EXT.indexOf(ext) !== -1 || DATA_EXT.indexOf(ext) !== -1) {
        if (file.size > MAX_FILE) {
          DS.ui.toast(t('fileTooLarge'));
          continue;
        }
        addDocument(file);
        continue;
      }
      DS.ui.toast((DS.isZh() ? '暂不支持该文件类型：' : 'Unsupported file type: ') + (ext || file.type || '?'));
    }
    Chat.renderAttachments();
    DS.updateSendButton();
    DS.Chat.focusInput();
  };

  function addDocument(file) {
    var attachment = {
      id: C.uid('a_'),
      kind: 'file',
      name: file.name || 'file',
      size: file.size,
      mime: file.type,
      fileId: null,
      uploading: true,
      progress: 0
    };
    DS.state.attachments.push(attachment);
    Chat.renderAttachments();
    DS.updateSendButton();
    DS.API.uploadFile(file, purposeFor(file), function (progress) {
      attachment.progress = progress;
      updateAttachmentProgress(attachment);
    }).then(function (data) {
      attachment.uploading = false;
      attachment.progress = 1;
      attachment.fileId = data && data.id;
      if (!attachment.fileId) throw new Error('missing file id');
      Chat.renderAttachments();
      DS.updateSendButton();
    }).catch(function (err) {
      attachment.uploading = false;
      attachment.error = DS.friendlyError(err);
      Chat.renderAttachments();
      DS.updateSendButton();
      DS.ui.toast(DS.friendlyError(err), { icon: 'alert', duration: 3000 });
    });
  }

  function updateAttachmentProgress(attachment) {
    var el = attachmentsEl.querySelector('[data-att="' + attachment.id + '"] .attachment-progress i');
    if (el) el.style.width = Math.round((attachment.progress || 0) * 100) + '%';
  }

  Chat.renderAttachments = function () {
    if (!attachmentsEl) return;
    var list = DS.state.attachments || [];
    attachmentsEl.hidden = !list.length;
    attachmentsEl.innerHTML = '';
    list.forEach(function (att) {
      var el = document.createElement('div');
      el.className = 'attachment' + (att.uploading ? ' is-uploading' : '');
      el.dataset.att = att.id;
      var thumb = att.kind === 'image' && att.dataUrl
        ? '<img src="' + C.escapeAttr(att.dataUrl) + '" alt="">'
        : '<span class="file-thumb">' + I.svg('file', 19) + '</span>';
      var sub = att.uploading
        ? t('uploading') + ' ' + Math.round((att.progress || 0) * 100) + '%'
        : att.error || t('fileReady');
      el.innerHTML = thumb +
        '<span class="attachment-info"><span class="attachment-name">' + escapeHtml(att.name) + '</span>' +
        '<span class="attachment-sub">' + escapeHtml(sub) + '</span></span>' +
        '<button type="button" class="attachment-remove" aria-label="' + escapeAttr(t('remove')) + '">' +
        I.svg('close', 12) + '</button>' +
        (att.uploading ? '<span class="attachment-progress"><i></i></span>' : '');
      el.querySelector('.attachment-remove').addEventListener('click', function () {
        DS.state.attachments = DS.state.attachments.filter(function (a) { return a.id !== att.id; });
        Chat.renderAttachments();
        DS.updateSendButton();
      });
      attachmentsEl.appendChild(el);
    });
  };

  function escapeAttr(value) {
    return C.escapeAttr(value);
  }

  /* ------------------------------------------------------------------ */
  /* Model picker styles are inline; expose helpers                      */
  /* ------------------------------------------------------------------ */

  DS.Chat.updateChips = updateChips;
  DS.Chat.refreshAssistant = refreshAssistant;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/*!
 * DeepSeek Mobile — settings sheet
 */
(function (global) {
  'use strict';

  var DS = global.DS;
  var C = global.DSCore;
  var I = global.DSIcons;

  var Settings = (DS.Settings = {});
  var sheetEl = null;
  var bodyEl = null;
  var statusTimer = null;

  function t(key, vars) {
    return DS.t(key, vars);
  }

  function el(tag, className, html) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (html != null) node.innerHTML = html;
    return node;
  }

  function group(title) {
    var wrapper = el('div', 'settings-group');
    if (title) {
      var head = el('div', 'settings-group-title');
      head.textContent = title;
      wrapper.appendChild(head);
    }
    return wrapper;
  }

  function row(label, sub, control, options) {
    options = options || {};
    var rowEl = el('div', 'setting-row' + (options.stack ? ' stack' : ''));
    var labelEl = el('div', 'setting-label');
    var b = el('b');
    b.textContent = label;
    labelEl.appendChild(b);
    if (sub) {
      var small = el('small');
      small.textContent = sub;
      labelEl.appendChild(small);
    }
    rowEl.appendChild(labelEl);
    if (control) {
      if (options.stack) {
        var wrap = el('div');
        wrap.appendChild(control);
        rowEl.appendChild(wrap);
      } else {
        rowEl.appendChild(control);
      }
    }
    return rowEl;
  }

  function button(text, className, onClick) {
    var btn = el('button', className || 'btn-small');
    btn.type = 'button';
    btn.textContent = text;
    if (onClick) btn.addEventListener('click', onClick);
    return btn;
  }

  function toggleSwitch(checked, onChange) {
    var wrap = el('label', 'switch');
    var input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = !!checked;
    input.addEventListener('change', function () { onChange(input.checked); });
    var track = el('span', 'switch-track');
    var thumb = el('span', 'switch-thumb');
    track.appendChild(thumb);
    wrap.appendChild(input);
    wrap.appendChild(track);
    return wrap;
  }

  function segmented(options, value, onChange) {
    var wrap = el('div', 'segmented');
    options.forEach(function (option) {
      var btn = el('button', option.value === value ? 'active' : '');
      btn.type = 'button';
      btn.textContent = option.label;
      btn.addEventListener('click', function () {
        Array.prototype.forEach.call(wrap.children, function (child) { child.classList.remove('active'); });
        btn.classList.add('active');
        onChange(option.value);
      });
      wrap.appendChild(btn);
    });
    return wrap;
  }

  function select(options, value, onChange) {
    var sel = el('select', 'setting-select');
    options.forEach(function (option) {
      var opt = document.createElement('option');
      opt.value = option.value;
      opt.textContent = option.label;
      if (option.value === value) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', function () { onChange(sel.value); });
    return sel;
  }

  function statusLine(text, kind) {
    var p = el('p', kind === 'error' ? 'setting-error' : 'setting-ok');
    p.textContent = text;
    return p;
  }

  function maskKey(key) {
    if (!key) return DS.isZh() ? '未设置' : 'Not set';
    if (key.length <= 10) return '••••' + key.slice(-2);
    return key.slice(0, 3) + '••••••' + key.slice(-4);
  }

  /* ------------------------------------------------------------------ */
  /* Open / close                                                        */
  /* ------------------------------------------------------------------ */

  Settings.init = function () {
    sheetEl = document.getElementById('settingsSheet');
    bodyEl = document.getElementById('settingsBody');
    var close = document.getElementById('settingsClose');
    if (close) close.addEventListener('click', Settings.close);
  };

  Settings.open = function () {
    Settings.render();
    if (!sheetEl) return;
    if (sheetEl.classList.contains('open')) return;
    DS.ui.pushOverlay(sheetEl);
  };

  Settings.close = function () {
    if (!sheetEl) return;
    DS.ui.popOverlay(sheetEl);
  };

  Settings.render = function () {
    if (!bodyEl) return;
    bodyEl.innerHTML = '';
    bodyEl.appendChild(apiGroup());
    bodyEl.appendChild(modelGroup());
    bodyEl.appendChild(appearanceGroup());
    bodyEl.appendChild(chatGroup());
    bodyEl.appendChild(dataGroup());
    bodyEl.appendChild(aboutGroup());
    DS.History.updateStorage();
  };

  /* ------------------------------------------------------------------ */
  /* Groups                                                              */
  /* ------------------------------------------------------------------ */

  function apiGroup() {
    var g = group(t('apiSection'));

    var changeKey = button(t('save'), 'btn-small', async function () {
      var value = await DS.ui.dialog({
        title: t('apiKey'),
        input: true,
        value: DS.settings.apiKey,
        placeholder: 'sk-...'
      });
      if (value == null) return;
      DS.settings.apiKey = value.trim();
      DS.saveSettings();
      Settings.render();
      DS.ui.toast(t('apiKeySaved'), { icon: 'check' });
    });
    var keyRow = row(t('apiKey'), maskKey(DS.settings.apiKey), changeKey);
    g.appendChild(keyRow);

    var urlBtn = button(t('save'), 'btn-small', async function () {
      var value = await DS.ui.dialog({
        title: t('apiBase'),
        input: true,
        value: DS.settings.baseUrl,
        placeholder: 'https://api.deepseek.com'
      });
      if (value == null) return;
      DS.settings.baseUrl = C.normalizeBaseUrl(value);
      DS.saveSettings();
      Settings.render();
    });
    g.appendChild(row(t('apiBase'), DS.settings.baseUrl, urlBtn));

    var testBtn = button(t('connectionTest'), 'btn-small');
    var testResult = el('p', 'setting-hint');
    testResult.textContent = '';
    testBtn.addEventListener('click', async function () {
      testBtn.disabled = true;
      testBtn.textContent = t('connecting');
      testResult.className = 'setting-hint';
      testResult.textContent = '…';
      try {
        await DS.API.testConnection(DS.settings.baseUrl, DS.settings.apiKey);
        testResult.className = 'setting-ok';
        testResult.textContent = t('apiOk');
      } catch (err) {
        testResult.className = 'setting-error';
        testResult.textContent = DS.friendlyError(err);
      } finally {
        testBtn.disabled = false;
        testBtn.textContent = t('connectionTest');
        if (statusTimer) clearTimeout(statusTimer);
        statusTimer = setTimeout(function () {
          testResult.textContent = '';
          testResult.className = 'setting-hint';
        }, 8000);
      }
    });
    g.appendChild(row(t('connectionTest'), DS.isZh() ? '使用当前 Key 请求一次模型列表' : 'Validate the key with GET /models', testBtn));
    g.appendChild(testResult);
    return g;
  }

  function modelGroup() {
    var g = group(t('modelSection'));
    var models = DS.state.models && DS.state.models.length ? DS.state.models : DS.DEFAULT_MODELS;
    var options = models.map(function (model) {
      var info = DS.getModel(model.id);
      return { value: model.id, label: info.name ? info.name + ' · ' + model.id : model.id };
    });
    var modelSelect = select(options, DS.settings.model, function (value) {
      DS.settings.model = value;
      DS.saveSettings();
      if (DS.state.current) {
        DS.state.current.model = value;
        DS.saveSession(DS.state.current);
      }
      DS.Chat.updateChips();
    });
    g.appendChild(row(t('defaultModel'), DS.isZh() ? '新对话默认使用的模型' : 'Default model for new chats', modelSelect));

    g.appendChild(row(t('thinkingDefault'), DS.isZh() ? '新对话默认开启深度思考' : 'Enable DeepThink for new chats',
      toggleSwitch(DS.settings.thinking, function (checked) {
        DS.settings.thinking = checked;
        DS.saveSettings();
      })));

    var effortControl = segmented([
      { value: 'low', label: t('effortLow') },
      { value: 'high', label: t('effortHigh') },
      { value: 'max', label: t('effortMax') }
    ], DS.settings.effort, function (value) {
      DS.settings.effort = value;
      DS.saveSettings();
    });
    g.appendChild(row(t('effort'), DS.isZh() ? '越高越慢，推理越充分' : 'Higher effort means deeper reasoning', effortControl));

    var tempWrap = el('div');
    tempWrap.style.display = 'flex';
    tempWrap.style.alignItems = 'center';
    tempWrap.style.gap = '10px';
    var tempValue = el('span', 'range-value');
    tempValue.textContent = Number(DS.settings.temperature).toFixed(1);
    var temp = document.createElement('input');
    temp.type = 'range';
    temp.min = '0';
    temp.max = '2';
    temp.step = '0.1';
    temp.value = DS.settings.temperature;
    temp.style.flex = '1';
    temp.style.accentColor = 'var(--accent)';
    temp.disabled = !!DS.settings.thinking;
    temp.addEventListener('input', function () {
      tempValue.textContent = Number(temp.value).toFixed(1);
      DS.settings.temperature = Number(temp.value);
      DS.saveSettings();
    });
    tempWrap.appendChild(temp);
    tempWrap.appendChild(tempValue);
    g.appendChild(row(t('temperature'), t('temperatureHint'), tempWrap));

    var maxInput = el('input', 'setting-input');
    maxInput.type = 'number';
    maxInput.min = '0';
    maxInput.max = '393216';
    maxInput.step = '1024';
    maxInput.placeholder = DS.isZh() ? '自动（官方默认）' : 'Auto (official default)';
    maxInput.value = DS.settings.maxTokens ? String(DS.settings.maxTokens) : '';
    maxInput.style.marginTop = '0';
    maxInput.style.maxWidth = '128px';
    maxInput.addEventListener('change', function () {
      var value = Number(maxInput.value) || 0;
      DS.settings.maxTokens = C.clamp(value, 0, 393216);
      DS.saveSettings();
    });
    g.appendChild(row(t('maxTokens'), t('maxTokensHint'), maxInput));

    var promptArea = el('textarea', 'setting-textarea');
    promptArea.placeholder = DS.isZh() ? '例如：你是一位耐心的中文写作助手…' : 'e.g. You are a patient writing assistant…';
    promptArea.value = DS.settings.systemPrompt || '';
    promptArea.addEventListener('change', function () {
      DS.settings.systemPrompt = promptArea.value;
      DS.saveSettings();
    });
    var promptRow = row(t('systemPrompt'), t('systemPromptHint'), promptArea, { stack: true });
    g.appendChild(promptRow);

    g.appendChild(row(t('search'), DS.isZh() ? '新对话默认开启联网搜索' : 'Enable web search for new chats',
      toggleSwitch(DS.settings.webSearch, function (checked) {
        DS.settings.webSearch = checked;
        DS.saveSettings();
      })));
    return g;
  }

  function appearanceGroup() {
    var g = group(t('appearanceSection'));
    g.appendChild(row(t('theme'), '', segmented([
      { value: 'auto', label: t('themeAuto') },
      { value: 'light', label: t('themeLight') },
      { value: 'dark', label: t('themeDark') }
    ], DS.settings.theme, function (value) {
      DS.settings.theme = value;
      DS.saveSettings();
      DS.applyTheme();
    })));

    var sizeWrap = el('div');
    sizeWrap.style.display = 'flex';
    sizeWrap.style.alignItems = 'center';
    sizeWrap.style.gap = '10px';
    var sizeValue = el('span', 'range-value');
    sizeValue.textContent = DS.settings.fontSize + 'px';
    var range = document.createElement('input');
    range.type = 'range';
    range.min = '14';
    range.max = '20';
    range.step = '1';
    range.value = DS.settings.fontSize;
    range.style.flex = '1';
    range.style.accentColor = 'var(--accent)';
    range.addEventListener('input', function () {
      sizeValue.textContent = range.value + 'px';
      DS.settings.fontSize = Number(range.value);
      DS.saveSettings();
      DS.applyFontSize();
    });
    sizeWrap.appendChild(range);
    sizeWrap.appendChild(sizeValue);
    g.appendChild(row(t('fontSize'), '', sizeWrap));

    var langSelect = select([
      { value: 'zh', label: '简体中文' },
      { value: 'en', label: 'English' }
    ], DS.settings.lang, function (value) {
      DS.setLanguage(value);
      Settings.render();
    });
    g.appendChild(row(t('language'), '', langSelect));
    return g;
  }

  function chatGroup() {
    var g = group(t('chatSection'));
    g.appendChild(row(t('autoTitle'), DS.isZh() ? '由模型生成简短的对话标题' : 'Ask the model for a short chat title',
      toggleSwitch(DS.settings.autoTitle, function (checked) {
        DS.settings.autoTitle = checked;
        DS.saveSettings();
      })));
    g.appendChild(row(t('showUsage'), DS.isZh() ? '在回答下方显示 token 用量' : 'Show token usage under answers',
      toggleSwitch(DS.settings.showUsage, function (checked) {
        DS.settings.showUsage = checked;
        DS.saveSettings();
        if (DS.state.current) DS.Chat.renderAll();
      })));
    g.appendChild(row(t('haptics'), DS.isZh() ? '发送与操作时的轻微震动' : 'Subtle vibration on actions',
      toggleSwitch(DS.settings.haptics, function (checked) {
        DS.settings.haptics = checked;
        DS.saveSettings();
      })));
    return g;
  }

  function dataGroup() {
    var g = group(t('dataSection'));
    g.appendChild(row(t('exportAll'), '', button(t('download'), 'btn-small', function () {
      DS.History.exportAll();
    })));
    g.appendChild(row(t('importData'), '', button(t('upload'), 'btn-small', function () {
      DS.History.importFile();
    })));
    g.appendChild(row(t('storageUsed'), '', (function () {
      var span = el('span', 'setting-value');
      span.dataset.storage = '1';
      span.textContent = '…';
      return span;
    })()));
    g.appendChild(row(t('clearAll'), '', button(t('delete'), 'btn-small', async function () {
      var ok = await DS.ui.confirm({ title: t('clearAll'), text: t('clearConfirm'), danger: true });
      if (!ok) return;
      await DS.clearAllSessions();
      DS.Chat.renderAll();
      DS.Chat.updateTopbar();
      DS.History.render();
      DS.ui.toast(t('done'), { icon: 'check' });
    })));
    return g;
  }

  function aboutGroup() {
    var g = group(t('about'));
    g.appendChild(row(t('version'), '', (function () {
      var span = el('span', 'setting-value');
      span.textContent = DS.VERSION;
      return span;
    })()));
    if (DS.state.deferredPrompt) {
      g.appendChild(row(t('install'), '', button(t('installBtn'), 'btn-small', DS.installApp)));
    }
    var aboutBtn = button(t('about'), 'btn-small', Settings.openAbout);
    g.appendChild(row(t('about'), DS.isZh() ? '版本信息与相关链接' : 'Version and links', aboutBtn));

    var note = el('p', 'settings-note');
    note.textContent = DS.isZh()
      ? '非官方客户端。所有对话直接发送至 DeepSeek 官方 API，API Key 仅保存在本机浏览器中。'
      : 'Unofficial client. Requests go straight to the official DeepSeek API; your key is stored only in this browser.';
    g.appendChild(note);
    return g;
  }

  /* ------------------------------------------------------------------ */
  /* About                                                               */
  /* ------------------------------------------------------------------ */

  Settings.openAbout = function () {
    var body = el('div', 'about-block');
    var mark = el('div', 'about-mark');
    mark.innerHTML = I.svg('logo', 64);
    body.appendChild(mark);
    var name = el('div', 'about-name');
    name.textContent = 'DeepSeek Mobile';
    body.appendChild(name);
    var version = el('div', 'about-version');
    version.textContent = 'v' + DS.VERSION + ' · ' + (DS.isZh() ? '非官方客户端' : 'Unofficial client');
    body.appendChild(version);
    var text = el('p', 'about-text');
    text.textContent = DS.isZh()
      ? '使用你自己的 DeepSeek API Key，在手机上聊天、深度思考、联网搜索、读取文件与图片，并支持语音输入和朗读。所有数据保存在本机，不上传第三方服务器。'
      : 'Chat, think deeply, search the web, read files and images, and use voice input with your own DeepSeek API key. Everything stays on this device.';
    body.appendChild(text);

    var links = el('div', 'about-links');
    [
      { label: DS.isZh() ? '开放平台' : 'Platform', url: 'https://platform.deepseek.com/api_keys' },
      { label: DS.isZh() ? 'API 文档' : 'API docs', url: 'https://api-docs.deepseek.com' },
      { label: 'GitHub', url: 'https://github.com/deepseek-ai/chat-demo' }
    ].forEach(function (item) {
      var a = el('a');
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = I.svg('external', 13) + '<span></span>';
      a.querySelector('span').textContent = item.label;
      links.appendChild(a);
    });
    body.appendChild(links);

    var install = button(t('install'), 'btn-primary compact', function () { DS.installApp(); });
    install.style.marginTop = '14px';
    body.appendChild(install);

    var disclaimer = el('p', 'settings-note');
    disclaimer.textContent = t('disclaimer');
    body.appendChild(disclaimer);

    DS.ui.sheet({ title: t('about'), body: body });
  };

  /* ------------------------------------------------------------------ */
  /* Helpers used elsewhere                                              */
  /* ------------------------------------------------------------------ */

  Settings.applyDefaultsToSession = function (session) {
    if (!session) return;
    session.model = DS.settings.model;
    session.thinking = DS.settings.thinking;
    session.effort = DS.settings.effort;
    session.webSearch = DS.settings.webSearch;
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/*!
 * DeepSeek Mobile — conversation history drawer, import/export
 */
(function (global) {
  'use strict';

  var DS = global.DS;
  var C = global.DSCore;
  var I = global.DSIcons;

  var History = (DS.History = {});
  var menuEl = null;

  function t(key) {
    return DS.t(key);
  }

  function el(tag, className, html) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (html != null) node.innerHTML = html;
    return node;
  }

  function previewOf(session) {
    var messages = session.messages || [];
    for (var i = messages.length - 1; i >= 0; i--) {
      var msg = messages[i];
      if (msg.role === 'user') {
        if (msg.content) return C.truncate(msg.content.replace(/\s+/g, ' '), 38);
        if (msg.attachments && msg.attachments.length) {
          return (DS.isZh() ? '［附件］' : '[Attachment] ') + (msg.attachments[0].name || '');
        }
      }
      if (msg.role === 'assistant' && msg.content) {
        return C.truncate(C.markdownToText(msg.content), 38);
      }
    }
    return DS.isZh() ? '空对话' : 'Empty chat';
  }

  function sortedSessions() {
    return DS.state.sessions.slice().sort(function (a, b) {
      if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      return (b.updatedAt || 0) - (a.updatedAt || 0);
    });
  }

  function matches(session, query) {
    if (!query) return true;
    if ((session.title || '').toLowerCase().indexOf(query) !== -1) return true;
    return (session.messages || []).some(function (msg) {
      return msg.role === 'user' && (msg.content || '').toLowerCase().indexOf(query) !== -1;
    });
  }

  History.init = function () {
    var search = document.getElementById('historySearch');
    if (search) {
      search.addEventListener('input', C.debounce(function () {
        DS.state.historyQuery = search.value.trim().toLowerCase();
        History.render();
      }, 120));
    }
    document.addEventListener('click', function (e) {
      if (menuEl && !menuEl.contains(e.target) && !e.target.closest('.session-more')) {
        closeMenu();
      }
    });
    var list = document.getElementById('sessionList');
    if (list) {
      list.addEventListener('scroll', closeMenu, { passive: true });
      list.addEventListener('click', onListClick);
      list.addEventListener('keydown', function (e) {
        var item = e.target.closest('.session-item');
        if (!item) return;
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openSessionById(item.dataset.id);
        }
      });
    }
  };

  function onListClick(event) {
    var more = event.target.closest('.session-more');
    if (more) {
      event.stopPropagation();
      var item = more.closest('.session-item');
      openMenu(item.dataset.id, more);
      return;
    }
    var itemEl = event.target.closest('.session-item');
    if (itemEl) openSessionById(itemEl.dataset.id);
  }

  function openSessionById(id) {
    closeMenu();
    DS.openSession(id);
    DS.ui.closeDrawer();
  }

  History.render = function () {
    var list = document.getElementById('sessionList');
    if (!list) return;
    closeMenu();
    var query = DS.state.historyQuery || '';
    var sessions = sortedSessions().filter(function (s) { return matches(s, query); });
    list.innerHTML = '';

    if (!sessions.length) {
      var empty = el('div', 'session-empty');
      empty.textContent = query ? t('noResults') : t('emptyHistory');
      list.appendChild(empty);
      return;
    }

    var groups = [];
    var pinned = sessions.filter(function (s) { return s.pinned; });
    if (pinned.length) {
      groups.push({ label: t('pinned'), sessions: pinned });
    }
    var map = new Map();
    sessions.filter(function (s) { return !s.pinned; }).forEach(function (session) {
      var label = C.dayGroup(session.updatedAt || session.createdAt || Date.now(), DS.settings.lang);
      if (!map.has(label)) {
        map.set(label, []);
        groups.push({ label: label, sessions: map.get(label) });
      }
      map.get(label).push(session);
    });

    groups.forEach(function (group) {
      var head = el('div', 'session-group-title');
      head.textContent = group.label;
      list.appendChild(head);
      group.sessions.forEach(function (session) {
        list.appendChild(buildItem(session));
      });
    });

    History.updateStorage();
  };

  function buildItem(session) {
    var item = el('div', 'session-item' + (DS.state.current && DS.state.current.id === session.id ? ' active' : ''));
    item.dataset.id = session.id;
    item.setAttribute('role', 'button');
    item.tabIndex = 0;

    var main = el('div', 'session-item-main');
    var title = el('span', 'session-title');
    title.textContent = DS.sessionTitle(session);
    var preview = el('span', 'session-preview');
    preview.textContent = previewOf(session);
    main.appendChild(title);
    main.appendChild(preview);
    item.appendChild(main);

    if (session.pinned) {
      var pin = el('span', 'pin-mark');
      pin.innerHTML = I.svg('pin', 12);
      item.appendChild(pin);
    }

    var more = el('button', 'session-more');
    more.type = 'button';
    more.setAttribute('aria-label', t('more'));
    more.innerHTML = I.svg('more', 16);
    item.appendChild(more);
    return item;
  }

  function closeMenu() {
    if (menuEl && menuEl.parentNode) menuEl.parentNode.removeChild(menuEl);
    menuEl = null;
  }

  function menuButton(label, icon, danger, onClick) {
    var btn = el('button', danger ? 'danger' : '');
    btn.type = 'button';
    btn.innerHTML = I.svg(icon, 16) + '<span></span>';
    btn.querySelector('span').textContent = label;
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      closeMenu();
      onClick();
    });
    return btn;
  }

  function openMenu(id, anchor) {
    closeMenu();
    var session = DS.state.sessions.filter(function (s) { return s.id === id; })[0];
    if (!session) return;
    menuEl = el('div', 'session-menu');
    menuEl.appendChild(menuButton(t('rename'), 'edit', false, async function () {
      var name = await DS.ui.prompt({
        title: t('rename'),
        value: session.title || DS.sessionTitle(session),
        placeholder: t('titlePlaceholder')
      });
      if (name) {
        session.title = name;
        DS.saveSession(session);
        if (DS.state.current && DS.state.current.id === session.id) DS.Chat.updateTopbar();
        History.render();
      }
    }));
    menuEl.appendChild(menuButton(session.pinned ? t('unpin') : t('pin'), 'pin', false, function () {
      session.pinned = !session.pinned;
      DS.saveSession(session);
      History.render();
    }));
    menuEl.appendChild(menuButton(t('exportChat'), 'download', false, function () {
      exportSessions([session], 'deepseek-chat.json');
    }));
    menuEl.appendChild(menuButton(t('delete'), 'trash', true, async function () {
      var ok = await DS.ui.confirm({ title: t('delete'), text: t('deleteConfirm'), danger: true });
      if (!ok) return;
      await DS.deleteSession(session.id);
      History.render();
      DS.Chat.updateTopbar();
    }));
    document.body.appendChild(menuEl);

    var rect = anchor.getBoundingClientRect();
    var width = menuEl.offsetWidth || 160;
    var left = Math.min(rect.right - width, global.innerWidth - width - 8);
    left = Math.max(8, left);
    var top = rect.bottom + 4;
    if (top + menuEl.offsetHeight > global.innerHeight - 12) {
      top = Math.max(12, rect.top - menuEl.offsetHeight - 4);
    }
    menuEl.style.left = left + 'px';
    menuEl.style.top = top + 'px';
  }

  /* ------------------------------------------------------------------ */
  /* Export / import                                                     */
  /* ------------------------------------------------------------------ */

  function timestamp() {
    var d = new Date();
    function pad(n) { return String(n).padStart(2, '0'); }
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes());
  }

  function exportSessions(sessions, filename) {
    if (!sessions || !sessions.length) {
      DS.ui.toast(t('emptyHistory'));
      return;
    }
    var payload = {
      app: 'deepseek-mobile',
      version: 1,
      exportedAt: new Date().toISOString(),
      sessions: sessions
    };
    var text = JSON.stringify(payload, null, 2);
    var blob = new Blob([text], { type: 'application/json' });
    var name = 'deepseek-chat-' + timestamp() + '.json';
    var file;
    try {
      file = new File([blob], name, { type: 'application/json' });
    } catch (e) {
      file = null;
    }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(function () {
        downloadBlob(blob, name);
      });
      DS.ui.toast(t('exportDone'), { icon: 'check' });
      return;
    }
    downloadBlob(blob, name);
    DS.ui.toast(t('exportDone'), { icon: 'check' });
  }

  function downloadBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1500);
  }

  History.exportCurrent = function () {
    var session = DS.state.current;
    if (!session || !session.messages.length) {
      DS.ui.toast(t('emptyHistory'));
      return;
    }
    exportSessions([session]);
  };

  History.exportAll = function () {
    exportSessions(sortedSessions());
  };

  History.importFile = function () {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = async function () {
        try {
          var data = JSON.parse(String(reader.result || '{}'));
          var sessions = Array.isArray(data) ? data : data.sessions;
          if (!Array.isArray(sessions)) throw new Error('invalid');
          var existing = new Set(DS.state.sessions.map(function (s) { return s.id; }));
          var imported = 0;
          for (var i = 0; i < sessions.length; i++) {
            var session = sessions[i];
            if (!session || typeof session !== 'object') continue;
            if (!Array.isArray(session.messages)) continue;
            if (!session.id || existing.has(session.id)) session.id = C.uid('s_');
            existing.add(session.id);
            if (!session.createdAt) session.createdAt = Date.now();
            if (!session.updatedAt) session.updatedAt = session.createdAt;
            session.title = session.title || '';
            session.messages = session.messages.filter(function (m) {
              return m && (m.role === 'user' || m.role === 'assistant');
            }).map(function (m) {
              if (!m.id) m.id = C.uid('m_');
              if (!m.createdAt) m.createdAt = session.createdAt;
              return m;
            });
            await DS.Store.put(JSON.parse(JSON.stringify(session)));
            imported++;
          }
          if (!imported) throw new Error('empty');
          var all = await DS.Store.all();
          DS.state.sessions = all.sort(function (a, b) {
            if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
            return (b.updatedAt || 0) - (a.updatedAt || 0);
          });
          History.render();
          DS.ui.toast(t('importDone') + ' · ' + imported, { icon: 'check' });
          var first = DS.state.sessions[0];
          if (first) DS.openSession(first);
        } catch (err) {
          DS.ui.toast(t('importFailed'), { icon: 'alert', duration: 3000 });
        } finally {
          if (input.parentNode) input.parentNode.removeChild(input);
        }
      };
      reader.onerror = function () {
        DS.ui.toast(t('importFailed'), { icon: 'alert' });
      };
      reader.readAsText(file);
    });
    input.click();
  };

  /* ------------------------------------------------------------------ */
  /* Storage                                                             */
  /* ------------------------------------------------------------------ */

  function fallbackSize() {
    try {
      return new Blob([JSON.stringify(DS.state.sessions)]).size;
    } catch (e) {
      return 0;
    }
  }

  History.updateStorage = function () {
    var label = document.getElementById('storageInfo');
    var targets = document.querySelectorAll('[data-storage]');
    DS.Store.usage().then(function (info) {
      var text;
      if (info && typeof info.usage === 'number' && info.usage > 0) {
        text = C.formatBytes(info.usage);
        if (info.quota) text += ' / ' + C.formatBytes(info.quota);
      } else {
        text = C.formatBytes(fallbackSize());
      }
      if (label) label.textContent = text;
      Array.prototype.forEach.call(targets, function (node) { node.textContent = text; });
    }).catch(function () {
      if (label) label.textContent = C.formatBytes(fallbackSize());
    });
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
